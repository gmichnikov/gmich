<!DOCTYPE html>
<html lang="en" class="speaker-html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0{% block viewport_extra %}{% endblock %}">
    <meta name="description" content="Speaker — assistive communication board">
    <title>{% block title %}Speaker{% endblock %}</title>
    {% block styles %}{% endblock %}
</head>
<body class="speaker-body">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
