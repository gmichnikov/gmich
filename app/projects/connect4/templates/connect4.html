{% extends 'base.html' %}

{% block title %}Connect 4{% endblock %}

{% block content %}

<style>
    .c4-wrapper {
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: calc(100vh - 70px - 60px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        margin: -20px;
    }

    .c4-wrapper h1 {
        color: white;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        font-size: 2.5em;
    }

    .c4-game-info {
        color: white;
        font-size: 1.5em;
        margin-bottom: 20px;
        text-align: center;
        min-height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .c4-player-indicator {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: inline-block;
        border: 3px solid white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        animation: c4Pulse 1s infinite;
    }

    @keyframes c4Pulse {
        0%,
        100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }

    .c4-board-container {
        background: #0066cc;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    .c4-board {
        display: grid;
        grid-template-columns: repeat(7, 70px);
        grid-template-rows: repeat(6, 70px);
        gap: 10px;
        background: #0055aa;
        padding: 15px;
        border-radius: 15px;
    }

    .c4-cell {
        width: 70px;
        height: 70px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        position: relative;
        box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .c4-cell.c4-preview {
        background: rgba(255, 255, 255, 0.5);
    }

    .c4-cell.c4-preview.c4-yellow {
        background: rgba(255, 215, 0, 0.4);
    }

    .c4-cell.c4-preview.c4-red {
        background: rgba(220, 20, 60, 0.4);
    }

    .c4-cell.c4-yellow:not(.c4-preview) {
        background: radial-gradient(circle at 30% 30%, #ffd700, #ffb700);
        animation: c4DropIn 0.5s ease-out;
    }

    .c4-cell.c4-red:not(.c4-preview) {
        background: radial-gradient(circle at 30% 30%, #dc143c, #a00020);
        animation: c4DropIn 0.5s ease-out;
    }

    @keyframes c4DropIn {
        0% {
            transform: translateY(-400px);
            opacity: 0;
        }
        60% {
            transform: translateY(10px);
        }
        80% {
            transform: translateY(-5px);
        }
        100% {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .c4-cell.c4-winning {
        animation: c4WinPulse 0.8s infinite;
    }

    @keyframes c4WinPulse {
        0%,
        100% {
            transform: scale(1);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
        }
        50% {
            transform: scale(1.15);
            box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0);
        }
    }

    .c4-doomed {
        animation: c4Shake 0.5s infinite, c4DoomGlow 1s infinite;
    }

    @keyframes c4Shake {
        0%,
        100% {
            transform: translateX(0) rotate(0deg);
        }
        25% {
            transform: translateX(-5px) rotate(-2deg);
        }
        75% {
            transform: translateX(5px) rotate(2deg);
        }
    }

    @keyframes c4DoomGlow {
        0%,
        100% {
            box-shadow: 0 0 20px 5px rgba(255, 0, 0, 0.5);
        }
        50% {
            box-shadow: 0 0 40px 15px rgba(255, 0, 0, 0.8);
        }
    }

    .c4-controls {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .c4-mode {
        display: flex;
        border: 2px solid white;
        border-radius: 10px;
        overflow: hidden;
    }

    .c4-mode-btn {
        padding: 10px 18px;
        font-size: 1em;
        background: transparent;
        border: none;
        cursor: pointer;
        font-weight: bold;
        color: white;
    }

    .c4-mode-btn + .c4-mode-btn {
        border-left: 2px solid white;
    }

    .c4-mode-btn.c4-mode-active {
        background: white;
        color: #667eea;
    }

    .c4-mode-btn:not(.c4-mode-active):hover {
        background: rgba(255, 255, 255, 0.16);
    }

    .c4-setting {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .c4-setting[hidden] {
        display: none;
    }

    .c4-setting-locked {
        opacity: 0.55;
    }

    .c4-mode-btn:disabled {
        cursor: default;
    }

    .c4-mode-btn:disabled:hover {
        background: transparent;
    }

    .c4-mode-btn.c4-mode-active:disabled:hover {
        background: white;
    }

    .c4-setting-label {
        color: white;
        font-size: 0.8em;
        font-weight: bold;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .c4-board.c4-locked .c4-cell {
        cursor: default;
    }

    .c4-new-game {
        padding: 10px 22px;
        font-size: 1em;
        background: transparent;
        border: 2px solid white;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        color: white;
    }

    .c4-new-game:hover {
        background: rgba(255, 255, 255, 0.16);
    }

    .c4-doom-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        color: #ff0000;
        padding: 30px 50px;
        border-radius: 20px;
        font-size: 2em;
        font-weight: bold;
        text-align: center;
        z-index: 1000;
        animation: c4DoomAppear 0.5s ease-out;
        border: 3px solid #ff0000;
        box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
    }

    @keyframes c4DoomAppear {
        0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }
        100% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    }

    .c4-confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background: #f0f;
        position: absolute;
        animation: c4ConfettiFall 3s linear;
    }

    @keyframes c4ConfettiFall {
        to {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        .c4-board {
            grid-template-columns: repeat(7, 45px);
            grid-template-rows: repeat(6, 45px);
            gap: 6px;
            padding: 10px;
        }

        .c4-cell {
            width: 45px;
            height: 45px;
        }

        .c4-wrapper h1 {
            font-size: 1.8em;
        }

        .c4-game-info {
            font-size: 1.2em;
        }

        .c4-mode-btn {
            padding: 8px 12px;
            font-size: 0.95em;
        }
    }
</style>

<div class="c4-wrapper">
    <h1>🔴 Connect 4 🟡</h1>
    <div class="c4-game-info" id="gameInfo">
        <span class="c4-player-indicator" id="playerIndicator"></span>
        <span id="statusText">Yellow's Turn</span>
    </div>
    <div class="c4-board-container" id="boardContainer">
        <div class="c4-board" id="board"></div>
    </div>
    <div class="c4-controls">
        <div class="c4-mode" id="c4Mode" role="group" aria-label="Game mode">
            <button type="button" class="c4-mode-btn c4-mode-active" data-mode="two-player" aria-pressed="true">Two players</button>
            <button type="button" class="c4-mode-btn" data-mode="vs-computer" aria-pressed="false">Vs computer</button>
        </div>
        <div class="c4-setting" id="c4Difficulty" hidden>
            <div class="c4-setting-label">Difficulty</div>
            <div class="c4-mode" role="group" aria-label="Difficulty">
                <button type="button" class="c4-mode-btn" data-difficulty="easy" aria-pressed="false">Easy</button>
                <button type="button" class="c4-mode-btn" data-difficulty="medium" aria-pressed="false">Medium</button>
                <button type="button" class="c4-mode-btn c4-mode-active" data-difficulty="hard" aria-pressed="true">Hard</button>
            </div>
        </div>
        <div class="c4-setting" id="c4First" hidden>
            <div class="c4-setting-label">First move</div>
            <div class="c4-mode" role="group" aria-label="Who goes first">
                <button type="button" class="c4-mode-btn c4-mode-active" data-first="you" aria-pressed="true">You first</button>
                <button type="button" class="c4-mode-btn" data-first="computer" aria-pressed="false">Computer first</button>
            </div>
        </div>
        <button class="c4-new-game" type="button" id="c4NewGame" hidden>Start over</button>
    </div>
</div>

<script>
    const ROWS = 6;
    const COLS = 7;
    const YELLOW = "c4-yellow";
    const RED = "c4-red";
    const MODE_TWO_PLAYER = "two-player";
    const MODE_VS_COMPUTER = "vs-computer";
    const DIFFICULTY_EASY = "easy";
    const DIFFICULTY_MEDIUM = "medium";
    const DIFFICULTY_HARD = "hard";
    const FIRST_YOU = "you";
    const FIRST_COMPUTER = "computer";
    const MEDIUM_SEARCH_DEPTH = 4;
    const COMPUTER_SEARCH_DEPTH = 7;
    const WIN_SCORE = 1000000;
    const COLUMN_ORDER = [3, 2, 4, 1, 5, 0, 6];

    let board = [];
    let currentPlayer = YELLOW;
    let gameOver = false;
    let isDoomState = false;
    let doomMessageShown = false;
    let gameMode = MODE_TWO_PLAYER;
    let difficulty = DIFFICULTY_HARD;
    let firstPlayer = FIRST_YOU;
    let turnToken = 0;

    function isVsComputer() {
        return gameMode === MODE_VS_COMPUTER;
    }

    function otherColor(color) {
        return color === YELLOW ? RED : YELLOW;
    }

    function computerColor() {
        return firstPlayer === FIRST_COMPUTER ? YELLOW : RED;
    }

    function humanColor() {
        return otherColor(computerColor());
    }

    function isComputerTurn() {
        return isVsComputer() && currentPlayer === computerColor();
    }

    function humanCanPlay() {
        return !gameOver && !isComputerTurn();
    }

    // Initialize the game
    function initGame() {
        turnToken += 1;
        board = Array(ROWS)
            .fill(null)
            .map(() => Array(COLS).fill(null));
        currentPlayer = YELLOW;
        gameOver = false;
        isDoomState = false;
        doomMessageShown = false;

        const boardElement = document.getElementById("board");
        boardElement.innerHTML = "";
        document.getElementById("boardContainer").classList.remove("c4-doomed");

        // Create cells (top to bottom, left to right for proper grid layout)
        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
                const cell = document.createElement("div");
                cell.className = "c4-cell";
                cell.dataset.row = row;
                cell.dataset.col = col;
                cell.addEventListener("click", () => handleCellClick(col));
                cell.addEventListener("mouseenter", () => handleCellHover(col, true));
                cell.addEventListener("mouseleave", () => handleCellHover(col, false));
                boardElement.appendChild(cell);
            }
        }

        updateBoardLock();
        updateStatus();
        updateCpuSettings();
        if (isComputerTurn()) scheduleComputerMove();
    }

    function updateCpuSettings() {
        const show = isVsComputer();
        document.getElementById("c4Difficulty").hidden = !show;
        document.getElementById("c4First").hidden = !show;
    }

    function handleCellClick(col) {
        if (!humanCanPlay()) return;

        const row = getLowestEmptyRow(col);
        if (row === -1) return; // Column is full

        // Clear preview
        clearPreview();

        // Place the piece
        board[row][col] = currentPlayer;
        const cell = getCell(row, col);
        cell.classList.add(currentPlayer);

        // Check for win
        if (checkWin(row, col)) {
            gameOver = true;
            showWinner();
            createConfetti();
            return;
        }

        // Check for draw
        if (isBoardFull()) {
            gameOver = true;
            document.getElementById("statusText").textContent = "It's a Draw!";
            updateNewGameButton();
            return;
        }

        // Switch player
        currentPlayer = currentPlayer === YELLOW ? RED : YELLOW;
        updateStatus();
        updateBoardLock();

        if (isComputerTurn()) {
            scheduleComputerMove();
            return;
        }

        // Check if next player is doomed
        checkDoomState();
    }

    function scheduleComputerMove() {
        const token = turnToken;
        window.setTimeout(() => {
            if (token !== turnToken || gameOver || !isComputerTurn()) return;
            playComputerMove();
        }, 450);
    }

    function scoreWindow(cells, player) {
        const opponentColor = otherColor(player);
        let mine = 0;
        let opponent = 0;
        cells.forEach((cell) => {
            if (cell === player) mine += 1;
            else if (cell === opponentColor) opponent += 1;
        });
        if (mine && opponent) return 0;
        if (mine === 4) return 100;
        if (opponent === 4) return -100;
        if (mine === 3) return 12;
        if (opponent === 3) return -16;
        if (mine === 2) return 3;
        if (opponent === 2) return -4;
        if (mine === 1) return 1;
        if (opponent === 1) return -1;
        return 0;
    }

    function evaluateBoard(player) {
        const opponentColor = otherColor(player);
        let score = 0;
        for (let row = 0; row < ROWS; row++) {
            if (board[row][3] === player) score += 3;
            else if (board[row][3] === opponentColor) score -= 3;
        }

        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS - 3; col++) {
                score += scoreWindow(
                    [
                        board[row][col],
                        board[row][col + 1],
                        board[row][col + 2],
                        board[row][col + 3],
                    ],
                    player
                );
            }
        }

        for (let col = 0; col < COLS; col++) {
            for (let row = 0; row < ROWS - 3; row++) {
                score += scoreWindow(
                    [
                        board[row][col],
                        board[row + 1][col],
                        board[row + 2][col],
                        board[row + 3][col],
                    ],
                    player
                );
            }
        }

        for (let row = 0; row < ROWS - 3; row++) {
            for (let col = 0; col < COLS - 3; col++) {
                score += scoreWindow(
                    [
                        board[row][col],
                        board[row + 1][col + 1],
                        board[row + 2][col + 2],
                        board[row + 3][col + 3],
                    ],
                    player
                );
            }
        }

        for (let row = 3; row < ROWS; row++) {
            for (let col = 0; col < COLS - 3; col++) {
                score += scoreWindow(
                    [
                        board[row][col],
                        board[row - 1][col + 1],
                        board[row - 2][col + 2],
                        board[row - 3][col + 3],
                    ],
                    player
                );
            }
        }

        return score;
    }

    function minimax(depth, alpha, beta, maximizing, player) {
        if (depth === 0) return evaluateBoard(player);

        const mover = maximizing ? player : otherColor(player);
        let value = maximizing ? -Infinity : Infinity;

        for (const col of COLUMN_ORDER) {
            const row = getLowestEmptyRow(col);
            if (row === -1) continue;

            board[row][col] = mover;
            let score;
            if (checkWinSimulation(row, col, mover)) {
                score = (maximizing ? 1 : -1) * (WIN_SCORE + depth);
            } else if (isBoardFull()) {
                score = 0;
            } else {
                score = minimax(depth - 1, alpha, beta, !maximizing, player);
            }
            board[row][col] = null;

            if (maximizing) {
                value = Math.max(value, score);
                alpha = Math.max(alpha, value);
            } else {
                value = Math.min(value, score);
                beta = Math.min(beta, value);
            }
            if (alpha >= beta) break;
        }

        return value;
    }

    function immediateWinColumn(player) {
        for (const col of COLUMN_ORDER) {
            const row = getLowestEmptyRow(col);
            if (row === -1) continue;
            board[row][col] = player;
            const wins = checkWinSimulation(row, col, player);
            board[row][col] = null;
            if (wins) return col;
        }
        return -1;
    }

    function chooseEasyColumn() {
        const player = computerColor();
        const winningMove = immediateWinColumn(player);
        if (winningMove !== -1) return winningMove;

        const blockingMove = immediateWinColumn(otherColor(player));
        if (blockingMove !== -1) return blockingMove;

        const legal = COLUMN_ORDER.filter((col) => getLowestEmptyRow(col) !== -1);
        if (legal.length === 0) return -1;
        if (Math.random() < 0.5) return legal[Math.floor(Math.random() * legal.length)];
        return legal[0];
    }

    function chooseSearchColumn(depth) {
        const player = computerColor();
        let bestScore = -Infinity;
        let bestCol = -1;

        for (const col of COLUMN_ORDER) {
            const row = getLowestEmptyRow(col);
            if (row === -1) continue;

            board[row][col] = player;
            let score;
            if (checkWinSimulation(row, col, player)) {
                score = WIN_SCORE + depth;
            } else if (isBoardFull()) {
                score = 0;
            } else {
                score = minimax(depth - 1, -Infinity, Infinity, false, player);
            }
            board[row][col] = null;

            if (score > bestScore) {
                bestScore = score;
                bestCol = col;
            }
        }

        return bestCol;
    }

    function chooseComputerColumn() {
        if (difficulty === DIFFICULTY_EASY) return chooseEasyColumn();
        const depth = difficulty === DIFFICULTY_MEDIUM ? MEDIUM_SEARCH_DEPTH : COMPUTER_SEARCH_DEPTH;
        return chooseSearchColumn(depth);
    }

    function playComputerMove() {
        const col = chooseComputerColumn();
        if (col === -1) return;

        clearPreview();
        const row = getLowestEmptyRow(col);
        const color = computerColor();
        board[row][col] = color;
        getCell(row, col).classList.add(color);

        if (checkWin(row, col)) {
            gameOver = true;
            showWinner();
            createConfetti();
            updateBoardLock();
            return;
        }

        if (isBoardFull()) {
            gameOver = true;
            document.getElementById("statusText").textContent = "It's a Draw!";
            updateBoardLock();
            updateNewGameButton();
            return;
        }

        currentPlayer = otherColor(color);
        updateStatus();
        updateBoardLock();
        checkDoomState();
    }

    function handleCellHover(col, isEntering) {
        if (!humanCanPlay()) return;

        clearPreview();

        if (isEntering) {
            const row = getLowestEmptyRow(col);
            if (row !== -1) {
                const cell = getCell(row, col);
                cell.classList.add("c4-preview", currentPlayer);
            }
        }
    }

    function clearPreview() {
        document.querySelectorAll(".c4-cell.c4-preview").forEach((cell) => {
            cell.classList.remove("c4-preview", YELLOW, RED);
        });
    }

    function getLowestEmptyRow(col) {
        for (let row = ROWS - 1; row >= 0; row--) {
            if (board[row][col] === null) {
                return row;
            }
        }
        return -1;
    }

    function getCell(row, col) {
        return document.querySelector(`.c4-cell[data-row="${row}"][data-col="${col}"]`);
    }

    function checkWin(row, col) {
        const player = board[row][col];

        // Check horizontal
        const horizontal =
            countDirection(row, col, 0, 1, player) +
            countDirection(row, col, 0, -1, player) +
            1;
        if (horizontal >= 4) {
            highlightWinningCells(row, col, 0, 1, player);
            return true;
        }

        // Check vertical
        const vertical =
            countDirection(row, col, 1, 0, player) +
            countDirection(row, col, -1, 0, player) +
            1;
        if (vertical >= 4) {
            highlightWinningCells(row, col, 1, 0, player);
            return true;
        }

        // Check diagonal (/)
        const diagonal1 =
            countDirection(row, col, -1, 1, player) +
            countDirection(row, col, 1, -1, player) +
            1;
        if (diagonal1 >= 4) {
            highlightWinningCells(row, col, -1, 1, player);
            return true;
        }

        // Check diagonal (\)
        const diagonal2 =
            countDirection(row, col, -1, -1, player) +
            countDirection(row, col, 1, 1, player) +
            1;
        if (diagonal2 >= 4) {
            highlightWinningCells(row, col, -1, -1, player);
            return true;
        }

        return false;
    }

    function countDirection(row, col, rowDir, colDir, player) {
        let count = 0;
        let r = row + rowDir;
        let c = col + colDir;

        while (
            r >= 0 &&
            r < ROWS &&
            c >= 0 &&
            c < COLS &&
            board[r][c] === player
        ) {
            count++;
            r += rowDir;
            c += colDir;
        }

        return count;
    }

    function highlightWinningCells(row, col, rowDir, colDir, player) {
        const cells = [[row, col]];

        // Forward direction
        let r = row + rowDir;
        let c = col + colDir;
        while (
            r >= 0 &&
            r < ROWS &&
            c >= 0 &&
            c < COLS &&
            board[r][c] === player
        ) {
            cells.push([r, c]);
            r += rowDir;
            c += colDir;
        }

        // Backward direction
        r = row - rowDir;
        c = col - colDir;
        while (
            r >= 0 &&
            r < ROWS &&
            c >= 0 &&
            c < COLS &&
            board[r][c] === player
        ) {
            cells.push([r, c]);
            r -= rowDir;
            c -= colDir;
        }

        cells.forEach(([r, c]) => {
            getCell(r, c).classList.add("c4-winning");
        });
    }

    function isBoardFull() {
        return board[0].every((cell) => cell !== null);
    }

    function updateBoardLock() {
        document.getElementById("board").classList.toggle("c4-locked", isComputerTurn());
    }

    function updateStatus() {
        const statusText = document.getElementById("statusText");
        const indicator = document.getElementById("playerIndicator");

        if (isVsComputer()) {
            statusText.textContent = isComputerTurn() ? "Computer's turn" : "Your turn";
        } else {
            statusText.textContent = `${currentPlayer === YELLOW ? "Yellow" : "Red"}'s Turn`;
        }
        indicator.style.background =
            currentPlayer === YELLOW
                ? "radial-gradient(circle at 30% 30%, #ffd700, #ffb700)"
                : "radial-gradient(circle at 30% 30%, #dc143c, #a00020)";
        updateNewGameButton();
    }

    function gameInProgress() {
        return !gameOver && board.some((row) => row.some((cell) => cell !== null));
    }

    function updateNewGameButton() {
        const button = document.getElementById("c4NewGame");
        const inProgress = gameInProgress();
        if (!inProgress && !gameOver) {
            button.hidden = true;
        } else {
            button.hidden = false;
            button.textContent = gameOver ? "Play again" : "Start over";
        }

        const difficultyGroup = document.getElementById("c4Difficulty");
        difficultyGroup.classList.toggle("c4-setting-locked", inProgress);
        difficultyGroup.querySelectorAll(".c4-mode-btn").forEach((btn) => {
            btn.disabled = inProgress;
        });
    }

    function showWinner() {
        const statusText = document.getElementById("statusText");
        if (isVsComputer()) {
            statusText.textContent = currentPlayer === humanColor() ? "You win!" : "Computer wins!";
        } else {
            statusText.textContent = `${currentPlayer === YELLOW ? "🟡 Yellow" : "🔴 Red"} Wins!`;
        }
        updateNewGameButton();
    }

    function checkDoomState() {
        // In a computer game the banner is for the human, whose turn it is.
        if (isVsComputer() && isComputerTurn()) return;

        // Check if current player is in a "doomed" state where opponent has multiple winning threats
        const opponent = currentPlayer === YELLOW ? RED : YELLOW;
        const winningThreats = countWinningThreats(opponent);

        if (winningThreats >= 2 && !doomMessageShown) {
            // Current player is doomed!
            isDoomState = true;
            doomMessageShown = true;
            showDoomMessage();
        }
    }

    function countWinningThreats(player) {
        let threats = 0;

        // Check each column for immediate winning moves
        for (let col = 0; col < COLS; col++) {
            const row = getLowestEmptyRow(col);
            if (row !== -1) {
                // Simulate the move
                board[row][col] = player;
                if (checkWinSimulation(row, col, player)) {
                    threats++;
                }
                board[row][col] = null;
            }
        }

        return threats;
    }

    function checkWinSimulation(row, col, player) {
        // Check if this position creates a win (without highlighting)
        const horizontal =
            countDirection(row, col, 0, 1, player) +
            countDirection(row, col, 0, -1, player) +
            1;
        if (horizontal >= 4) return true;

        const vertical =
            countDirection(row, col, 1, 0, player) +
            countDirection(row, col, -1, 0, player) +
            1;
        if (vertical >= 4) return true;

        const diagonal1 =
            countDirection(row, col, -1, 1, player) +
            countDirection(row, col, 1, -1, player) +
            1;
        if (diagonal1 >= 4) return true;

        const diagonal2 =
            countDirection(row, col, -1, -1, player) +
            countDirection(row, col, 1, 1, player) +
            1;
        if (diagonal2 >= 4) return true;

        return false;
    }

    function showDoomMessage() {
        const message = document.createElement("div");
        message.className = "c4-doom-message";
        message.textContent = "💀 DOOMED! 💀\nYour opponent has multiple winning moves!";
        message.style.whiteSpace = "pre-line";
        document.body.appendChild(message);

        // Add shake effect to board
        document.getElementById("boardContainer").classList.add("c4-doomed");

        // Remove message after 3 seconds
        setTimeout(() => {
            message.remove();
            document.getElementById("boardContainer").classList.remove("c4-doomed");
        }, 3000);
    }

    function createConfetti() {
        const colors = ["#ffd700", "#dc143c", "#00ff00", "#00ffff", "#ff00ff", "#ff8800"];

        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const confetti = document.createElement("div");
                confetti.style.position = "fixed";
                confetti.style.left = Math.random() * 100 + "%";
                confetti.style.top = "-10px";
                confetti.style.width = "10px";
                confetti.style.height = "10px";
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
                confetti.style.animation = `c4ConfettiFall ${2 + Math.random() * 2}s linear`;
                confetti.style.zIndex = "999";
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 4000);
            }, i * 30);
        }
    }

    function resetGame() {
        // Remove any doom messages
        document.querySelectorAll(".c4-doom-message").forEach((el) => el.remove());
        initGame();
    }

    function markSelected(group, attribute, value) {
        group.querySelectorAll(".c4-mode-btn").forEach((btn) => {
            const selected = btn.dataset[attribute] === value;
            btn.classList.toggle("c4-mode-active", selected);
            btn.setAttribute("aria-pressed", selected ? "true" : "false");
        });
    }

    function setGameMode(mode) {
        if (mode !== MODE_TWO_PLAYER && mode !== MODE_VS_COMPUTER) return;
        if (mode === gameMode) return;
        gameMode = mode;
        markSelected(document.getElementById("c4Mode"), "mode", gameMode);
        resetGame();
    }

    function setDifficulty(next) {
        if (gameInProgress()) return;
        if (next !== DIFFICULTY_EASY && next !== DIFFICULTY_MEDIUM && next !== DIFFICULTY_HARD) return;
        if (next === difficulty) return;
        difficulty = next;
        markSelected(document.getElementById("c4Difficulty"), "difficulty", difficulty);
    }

    function setFirstPlayer(next) {
        if (next !== FIRST_YOU && next !== FIRST_COMPUTER) return;
        if (next === firstPlayer) return;
        firstPlayer = next;
        markSelected(document.getElementById("c4First"), "first", firstPlayer);
        resetGame();
    }

    document.getElementById("c4Mode").querySelectorAll(".c4-mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => setGameMode(btn.dataset.mode));
    });
    document.getElementById("c4Difficulty").querySelectorAll(".c4-mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => setDifficulty(btn.dataset.difficulty));
    });
    document.getElementById("c4First").querySelectorAll(".c4-mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => setFirstPlayer(btn.dataset.first));
    });
    document.getElementById("c4NewGame").addEventListener("click", resetGame);

    // Start the game
    initGame();
</script>

{% endblock %}
