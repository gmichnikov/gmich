{% extends 'base.html' %}

{% block title %}Connect 4 Online{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('connect4_online.static', filename='style.css') }}">

<div class="c4o-wrapper">
    <div class="c4o-container">
        <h1>Connect 4 Online</h1>
        <p class="c4o-subtitle">Play a friend with a link, or play the computer. No login required.</p>

        <div class="c4o-landing-panel">
            <button id="c4oCreateBtn" class="c4o-primary-btn" type="button">Create New Game</button>

            <div class="c4o-cpu-options" id="c4oCpuOptions">
                <div class="c4o-setting">
                    <div class="c4o-setting-label">Difficulty</div>
                    <div class="c4o-segment" id="c4oDifficulty" role="group" aria-label="Difficulty">
                        <button type="button" class="c4o-segment-btn" data-difficulty="easy" aria-pressed="false">Easy</button>
                        <button type="button" class="c4o-segment-btn c4o-segment-active" data-difficulty="medium" aria-pressed="true">Medium</button>
                        <button type="button" class="c4o-segment-btn" data-difficulty="hard" aria-pressed="false">Hard</button>
                        <button type="button" class="c4o-segment-btn" data-difficulty="very-hard" aria-pressed="false">Very hard</button>
                    </div>
                </div>
                <div class="c4o-setting">
                    <div class="c4o-setting-label">First move</div>
                    <div class="c4o-segment" id="c4oFirst" role="group" aria-label="Who goes first">
                        <button type="button" class="c4o-segment-btn c4o-segment-active" data-first="you" aria-pressed="true">You first</button>
                        <button type="button" class="c4o-segment-btn" data-first="computer" aria-pressed="false">Computer first</button>
                    </div>
                </div>
            </div>
            <button id="c4oVsCpuBtn" class="c4o-secondary-btn c4o-link-btn" type="button">Play vs Computer</button>

            <div class="c4o-divider">or</div>

            <form id="c4oJoinForm" class="c4o-join-form">
                <label for="c4oJoinCode">Join with a room code</label>
                <input type="text" id="c4oJoinCode" maxlength="6" placeholder="e.g. AB3XQK" autocomplete="off">
                <button type="submit" class="c4o-secondary-btn">Join</button>
            </form>
        </div>

        <p id="c4oLandingError" class="c4o-error" hidden></p>
    </div>
</div>

<script>
    var C4O_CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
</script>
<script src="{{ url_for('connect4_online.static', filename='landing.js') }}"></script>
{% endblock %}
