{% extends "nfl_survivor/layout.html" %}

{% block ns_title %}Auto Pick{% endblock %}

{% block ns_content %}
<h1 class="ns-card-title">Auto pick</h1>
<p class="ns-help-text">Set picks for participants who haven't picked yet, using the best available spread.</p>
<form method="post" class="ns-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="week_number">Week number</label>
  <input type="number" id="week_number" name="week_number" required>
  <button type="submit" class="ns-btn ns-btn-primary">Run auto pick</button>
</form>
{% endblock %}
