{% extends "nfl_survivor/layout.html" %}

{% block ns_title %}Auto Update Results{% endblock %}

{% block ns_content %}
<h1 class="ns-card-title">Auto update results</h1>
<p class="ns-help-text">Pull scores from ESPN for a completed week.</p>
<form method="post" class="ns-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="week_number">Week</label>
  <select id="week_number" name="week_number">
    {% for choice in week_choices %}
    <option value="{{ choice.week }}"
            {% if choice.week == selected_week %}selected{% endif %}>
      {{ choice.label }}
    </option>
    {% endfor %}
  </select>
  <button type="submit" class="ns-btn ns-btn-primary">Update from ESPN</button>
</form>
{% endblock %}
