{% extends "japan_recs/base.html" %}

{% block title %}Japan Recs{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('japan_recs.static', filename='japan_recs/style.css') }}">
{% endblock %}

{% block content %}
<div class="japan-recs-landing">
  <header class="japan-recs-landing-header">
    <h1 class="japan-recs-landing-title">Japan Recs</h1>
  </header>
  <nav class="japan-recs-landing-nav" aria-label="City maps">
    <a class="japan-recs-landing-card" href="{{ url_for('japan_recs.kyoto') }}">
      <span class="japan-recs-landing-card-icon" aria-hidden="true">⛩️</span>
      <span class="japan-recs-landing-card-name">Kyoto</span>
    </a>
    <a class="japan-recs-landing-card" href="{{ url_for('japan_recs.tokyo') }}">
      <span class="japan-recs-landing-card-icon" aria-hidden="true">🗼</span>
      <span class="japan-recs-landing-card-name">Tokyo</span>
    </a>
  </nav>
</div>
{% endblock %}
