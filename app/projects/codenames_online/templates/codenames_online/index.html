{% extends 'base.html' %}

{% block title %}Codenames{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('codenames_online.static', filename='style.css') }}">

<div class="cno-wrapper">
    <div class="cno-container">
        <h1>Codenames</h1>
        <p class="cno-subtitle">Two phones, four players &mdash; share a link and play in person.</p>

        <div class="cno-landing-panel">
            <button id="cnoCreateBtn" class="cno-primary-btn" type="button">Create New Game</button>

            <div class="cno-divider">or</div>

            <form id="cnoJoinForm" class="cno-join-form">
                <label for="cnoJoinCode">Join with a room code</label>
                <input type="text" id="cnoJoinCode" maxlength="6" placeholder="e.g. AB3XQK" autocomplete="off">
                <button type="submit" class="cno-secondary-btn">Join</button>
            </form>
        </div>

        <p id="cnoLandingError" class="cno-error" hidden></p>
    </div>
</div>

<script>
    var CNO_CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
</script>
<script src="{{ url_for('codenames_online.static', filename='landing.js') }}"></script>
{% endblock %}
