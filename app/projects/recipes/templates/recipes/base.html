<!DOCTYPE html>
<html lang="en" class="recipes-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recipes — kitchen ingredient sheets">
  <title>{% block title %}Recipes{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}recipes-body{% endblock %}">
  {% block content %}{% endblock %}
</body>
</html>
